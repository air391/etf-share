name: ETF Share Data Daily Update

on:
  schedule:
    # 每个工作日北京时间 19:30 运行（UTC 11:30）
    # 交易所通常在 18:00 前后发布完整的当日份额数据
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # 支持手动点击按钮立即触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许工作流将 CSV 和静态页面写回仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental data update
        run: python update_data.py

      - name: Generate static pages
        run: python generate_pages.py

      - name: Commit and push updated data and pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "Auto Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No new data to commit."
          fi

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

